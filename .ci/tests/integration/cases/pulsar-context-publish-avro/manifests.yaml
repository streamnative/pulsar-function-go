apiVersion: compute.functionmesh.io/v1alpha1
kind: Function
metadata:
  name: pulsar-context-publish-avro-generic-sample
  namespace: default
spec:
  image: streamnative/pulsar-functions-generic-base-runner:latest
  className: contextpublishavro
  forwardSourceMessageProperty: true
  maxPendingAsyncRequests: 1000
  replicas: 1
  input:
    sourceSpecs:
      "persistent://public/default/pulsar-context-publish-avro-input":
        schemaType: avro
    typeClassName: Student
  output:
    topic: persistent://public/default/pulsar-context-publish-avro-unused-output
    typeClassName: string
  funcConfig:
    publishTopic: persistent://public/default/pulsar-context-publish-avro-output
    _child_protocol: binary_v2
  resources:
    requests:
      cpu: 500m
      memory: 0.5G
    limits:
      cpu: 500m
      memory: 0.5G
  pulsar:
    pulsarConfig: "test-pulsar-context-publish-avro-pulsar"
    tlsConfig:
      enabled: false
      allowInsecure: true
      hostnameVerification: true
  genericRuntime:
    functionFile: contextpublishavro
    functionFileLocation: function://public/default/exec-context-publish-avro
    language: executable
  clusterName: test
  autoAck: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-pulsar-context-publish-avro-pulsar
data:
  webServiceURL: http://sn-platform-pulsar-broker.default.svc.cluster.local:8080
  brokerServiceURL: pulsar://sn-platform-pulsar-broker.default.svc.cluster.local:6650
